name: TALON SCALP safety checks
on:
  push:
    branches: [main]
    paths:
      - 'scalp/**'
      - '.github/workflows/scalp-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scalp/requirements.txt
      - run: python -m py_compile scalp/app.py
      - name: Run paper simulator tests
        run: cd scalp && python -m unittest discover -p 'test_*.py' -v
