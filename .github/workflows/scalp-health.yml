name: Verify TALON PRO live dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scalp-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify streaming feed, interactive charts, maker shadow
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base='https://talon-scalp-stream-production.up.railway.app'
          def fetch(path):
              with urllib.request.urlopen(base+path, timeout=12) as res:
                  return res.read().decode('utf-8')
          for i in range(12):
              try:
                  j=json.loads(fetch('/api/status'))
                  k=json.loads(fetch('/api/history?symbol=BTC%2FUSD&range=5m'))
                  html=fetch('/')
                  assert j.get('mode')=='PAPER ONLY'
                  assert j.get('feed')=='CONNECTED', j.get('feed')
                  assert j.get('active_markets',0)>0
                  assert j.get('seen',0)>0
                  assert j.get('maker_shadow',{}).get('mode')=='PAPER ONLY MAKER SHADOW'
                  assert 'BTC/USD' in j.get('sparklines',{})
                  assert 'equity_sparkline' in j
                  assert j.get('stats') is not None
                  assert 'filter_reasons' in j
                  assert k.get('mode')=='PAPER ONLY'
                  assert isinstance(k.get('price'),list)
                  assert isinstance(k.get('equity'),list)
                  assert 'data-open="equity"' in html
                  assert 'makerEquity' in html
                  assert 'refreshDetail' in html
                  print('PASS: TALON PRO interactive dashboard live')
                  print('Feed:',j['feed'],'Fresh markets:',j['active_markets'])
                  print('Updates:',j['seen'],'Market samples:',sum(len(v) for v in j['sparklines'].values()))
                  print('Maker quotes:',j['maker_shadow']['counts']['quoted'])
                  print('Maker fills:',j['maker_shadow']['counts']['filled'])
                  print('Maker trades:',len(j['maker_shadow']['trades']))
                  print('Taker trades:',len(j['trades']))
                  print('Historical 5m samples:',len(k['price']))
                  break
              except Exception as e:
                  print('Attempt',i+1,'not ready:',repr(e))
                  if i==11: raise
                  time.sleep(10)
          PY
